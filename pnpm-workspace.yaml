packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - unrs-resolver

# Security remediation for transitive dependencies. Each entry exists only to pull a
# vulnerable transitive up to a patched version; remove an entry once the parent
# package ships a fix of its own.
overrides:
  # @storybook/test-runner -> jest-process-manager@0.4.0 (unmaintained) -> wait-on@7 -> axios
  axios: ^1.19.0
  lodash: ^4.18.1
  follow-redirects: ^1.16.0
  form-data: ^4.0.6
  joi: ^17.13.4
  '@babel/core': ^7.29.6
  uuid: ^11.1.1

  # Several major lines of these coexist in the tree, so pin each line separately.
  # A blanket override would force e.g. minimatch@3 consumers onto the v10 named-export API.
  minimatch@3: ^3.1.3
  minimatch@5: ^5.1.8
  minimatch@9: ^9.0.7
  minimatch@10: ^10.2.6
  brace-expansion@1: ^1.1.17
  brace-expansion@2: ^2.1.3
  brace-expansion@5: ^5.0.9
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.5
  js-yaml@3: ^3.15.0
  js-yaml@4: ^4.3.0
  # ajv@6 is required by @eslint/eslintrc and is not affected; only the v8 line is.
  ajv@8: ^8.20.0

  body-parser: ^2.3.0
  degit: ^2.8.6
  esbuild: ^0.28.1
  fast-uri: ^3.1.4
  flatted: ^3.4.4
  immutable: ^5.1.9
  js-cookie: ^3.0.8
  linkify-it: ^5.0.2
  markdown-it: ^14.3.0
  path-to-regexp: ^8.4.2
  postcss: ^8.5.25
  qs: ^6.15.3
  rollup: ^4.62.4
  serialize-javascript: ^7.0.7
  svgo: ^4.0.2
  ws: ^8.21.1
  yaml: ^2.9.0
